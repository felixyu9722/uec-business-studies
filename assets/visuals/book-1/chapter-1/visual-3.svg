<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#eef4fb"/><rect x="46" y="42" width="1108" height="591" rx="28" fill="#f8fbff" stroke="#cdd9ea"/>
<rect x="46" y="42" width="18" height="591" rx="9" fill="#b97713"/><text x="88" y="106" font-size="21" font-weight="700" fill="#b97713">第一册第1章 · 资料判断</text>
<text x="88" y="158" font-size="40" font-weight="800" fill="#10213f">资料能不能用于专题？</text><rect x="86" y="187" width="1028" height="90" rx="18" fill="#ffffff" stroke="#cdd9ea"/>
<circle cx="136" cy="232" r="27" fill="#b97713"/><text x="136" y="241" text-anchor="middle" font-size="24" font-weight="700" fill="white">1</text>
<text x="188" y="225" font-size="26" font-weight="700" fill="#10213f">来源</text><text x="188" y="259" font-size="18" fill="#536783">作者、机构与发布平台是否可靠</text><rect x="86" y="305" width="1028" height="90" rx="18" fill="#ffffff" stroke="#cdd9ea"/>
<circle cx="136" cy="350" r="27" fill="#b97713"/><text x="136" y="359" text-anchor="middle" font-size="24" font-weight="700" fill="white">2</text>
<text x="188" y="343" font-size="26" font-weight="700" fill="#10213f">时效</text><text x="188" y="377" font-size="18" fill="#536783">资料日期是否符合研究问题需要</text><rect x="86" y="423" width="1028" height="90" rx="18" fill="#ffffff" stroke="#cdd9ea"/>
<circle cx="136" cy="468" r="27" fill="#b97713"/><text x="136" y="477" text-anchor="middle" font-size="24" font-weight="700" fill="white">3</text>
<text x="188" y="461" font-size="26" font-weight="700" fill="#10213f">证据</text><text x="188" y="495" font-size="18" fill="#536783">结论是否有数据、文件或访谈支持</text><rect x="86" y="541" width="1028" height="90" rx="18" fill="#ffffff" stroke="#cdd9ea"/>
<circle cx="136" cy="586" r="27" fill="#b97713"/><text x="136" y="595" text-anchor="middle" font-size="24" font-weight="700" fill="white">4</text>
<text x="188" y="579" font-size="26" font-weight="700" fill="#10213f">交叉核对</text><text x="188" y="613" font-size="18" fill="#536783">是否能由另一项独立资料互相印证</text></svg>